- set_fact:
    install_count: "{{ install_count | combine({ chaincode.name: 1 }) }}"
  when:
    - install_count[chaincode.name] is defined

- set_fact:
    install_count: "{{ install_count | combine({ chaincode.name: 0 }) }}"
  when:
    - install_count[chaincode.name] is not defined

# Check if buildpack_path exists
- name: Check if buildpack_path exists
  stat:
    path: "{{ chaincode.buildpack_path }}"
  register: buildpack_path_file
  failed_when:
    - buildpack_path_file.stat.exists == false
  when:
    - chaincode.buildpack_path is defined and chaincode.buildpack_path != ""

# Copy buildpack for external chaincode
- name: Copy buildpack for external chaincode
  shell: |
    KUBECONFIG={{ kubernetes.config_file }} kubectl exec -i -n {{ org_ns }} fabric-peernode-{{ peer.name }}-0 -c {{ peer.name }} -- mkdir -p /var/hyperledger/production/buildpacks/sampleBuilder/bin
    KUBECONFIG={{ kubernetes.config_file }} kubectl cp {{ chaincode.buildpack_path }}/. {{ org_ns }}/fabric-peernode-{{ peer.name }}-0:/var/hyperledger/production/buildpacks/sampleBuilder/bin -c {{ peer.name }}
    KUBECONFIG={{ kubernetes.config_file }} kubectl exec -i -n {{ org_ns }} fabric-peernode-{{ peer.name }}-0 -c {{ peer.name }} -- sh -c  "cd /var/hyperledger/production/buildpacks/sampleBuilder/bin && mv */* ./"
    KUBECONFIG={{ kubernetes.config_file }} kubectl exec -i -n {{ org_ns }} fabric-peernode-{{ peer.name }}-0 -c {{ peer.name }} -- chmod -R 777 /var/hyperledger/production/buildpacks/sampleBuilder/bin/
  when: 
    - chaincode.buildpack_path is defined

# Copy buildpack for external chaincode
- name: Use the peer's default ccaas builder
  shell: |
    KUBECONFIG={{ kubernetes.config_file }} kubectl exec -i -n {{ org_ns }} fabric-peernode-{{ peer.name }}-0 -c {{ peer.name }} -- mkdir -p /var/hyperledger/production/buildpacks/sampleBuilder/
    KUBECONFIG={{ kubernetes.config_file }} kubectl exec -i -n {{ org_ns }} fabric-peernode-{{ peer.name }}-0 -c {{ peer.name }} -- cp -r /opt/hyperledger/ccaas_builder/bin /var/hyperledger/production/buildpacks/sampleBuilder/bin
  when: 
    - chaincode.buildpack_path is not defined or chaincode.buildpack_path == ""

# Create value file for chaincode installation
- name: "Create value file for chaincode installation"
  include_role:
    name: helm_component
  vars:
    type: "install_external_chaincode_job"
    peer_name: "{{ peer.name }}"
    peer_address: "{{ peer.name }}.{{ namespace }}:{{ peer.grpc.port }}"
    component_name: "instextcc-{{ peer.name }}-{{ chaincode.name }}-{{ chaincode.version | replace('.','-')}}"
    component_chaincode: "{{ chaincode }}"
    component_subject: "{{ org_subject }}"
    env_type: "{{ network.env.type }}"

# Git Push : Push the above generated files to git directory 
- name: Git Push
  include_role: 
    name: "{{ playbook_dir }}/../../shared/configuration/roles/git_push"
  vars:
    GIT_DIR: "{{ playbook_dir }}/../../../"
    gitops: "{{ org.gitops }}"
    msg: "[ci skip] Pushing install external files"

# Check or Wait if install-chaincode is already run
- name: "Waiting for chaincode to be installed on {{ peer.name }}"
  include_role:
    name: "{{ playbook_dir }}/../../shared/configuration/roles/check/helm_component"
  vars:
    component_type: "Job"
    component_name: "{{ 'installchaincode' if chaincode is defined and ( chaincode.external_chaincode is undefined or chaincode.external_chaincode == false ) else 'instextcc' }}-{{ peer.name }}-{{ chaincode.name }}-{{ chaincode.version }}"