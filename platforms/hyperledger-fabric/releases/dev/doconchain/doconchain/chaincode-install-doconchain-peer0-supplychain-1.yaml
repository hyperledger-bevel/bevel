apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: chaincode-install-doconchain-peer0-supplychain-1
  namespace: doconchain-net
  annotations:
    fluxcd.io/automated: "false"
spec:
  interval: 1m
  releaseName: chaincode-install-doconchain-peer0-supplychain-1
  chart:
    spec:
      interval: 1m
      sourceRef:
        kind: GitRepository
        name: flux-prod
        namespace: flux-prod
      chart: platforms/hyperledger-fabric/charts/fabric-chaincode-install
  values:
    metadata:
      namespace: doconchain-net
      network:
        version: 2.5.4
      images:
        fabricTools: ghcr.io/hyperledger/bevel-fabric-tools:2.5.4
        alpineUtils: ghcr.io/hyperledger/bevel-alpine:latest

    peer:
      name: peer0
      address: peer0.doconchain-net:7051
      localmspid: doconchainMSP
      loglevel: debug
      tlsstatus: true
    vault:
      role: vault-role
      address: http://vault.vault.svc:8200
      authpath: proddoconchain
      adminsecretprefix: secretsv2/data/doconchain/peerOrganizations/doconchain-net/users/admin 
      orderersecretprefix: secretsv2/data/doconchain/peerOrganizations/doconchain-net/orderer
      secretgitprivatekey: secretsv2/data/doconchain/credentials/doconchain-net/git
      serviceaccountname: vault-auth
      type: hashicorp
      imagesecretname: ""
      tls: false
    orderer:
      address: orderer3.doconchain-net.org1proxy.hlf.doconchain.com:443
    chaincode:
      builder: hyperledger/fabric-ccenv:2.5.4
      name: supplychain
      version: 1
      lang: golang
      maindirectory: main
      repository:
        hostname: "github.com"
        git_username: "henjimantaring"
        url: github.com/henjimantaring/bevel-samples.git
        branch: main
        path: /examples/supplychain-app/fabric/chaincode_rest_server/chaincode/supplychain
      endorsementpolicies:  ''
