apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: orderer2
  namespace: doconchain-net
  annotations:
    fluxcd.io/automated: "false"
spec:
  interval: 1m
  releaseName: orderer2
  chart:
    spec:
      interval: 1m
      sourceRef:
        kind: GitRepository
        name: flux-staging
        namespace: flux-staging
      chart: platforms/hyperledger-fabric/charts/fabric-orderernode
  values:
    global:
      version: 2.5.4
      serviceAccountName: vault-auth
      cluster:
        provider: aws
        cloudNativeServices: false
      vault:
        type: hashicorp
        network: fabric
        address: http://vault.vault.svc:8200
        authPath: stagingdoconchain
        secretEngine: secretsv2
        secretPrefix: "data/stagingdoconchain"
        role: vault-role
        tls: false
      proxy:
        provider: haproxy
        externalUrlSuffix: org1proxy.hlf.doconchain.com

    storage:
      size: 512Mi
      reclaimPolicy: "Delete" 
      volumeBindingMode: 
      allowedTopologies:
        enabled: false

    certs:
      generateCertificates: true
      orgData:
        caAddress: ca.doconchain-net.org1proxy.hlf.doconchain.com
        caAdminUser: doconchain-admin
        caAdminPassword: doconchain-adminpw
        orgName: doconchain
        type: orderer
        componentSubject: "O=Orderer,OU=Orderer,L=51.50/-0.13/London,C=GB"

      settings:
        createConfigMaps: False
        refreshCertValue: false
        addPeerValue: false
        removeCertsOnDelete: true
        removeOrdererTlsOnDelete: true

    image:
      orderer: ghcr.io/hyperledger/bevel-fabric-orderer
      alpineUtils: ghcr.io/hyperledger/bevel-alpine:latest
      pullSecret: ""

    orderer:
      consensus: raft
      logLevel: info
      localMspId: doconchainMSP
      tlsStatus: true
      keepAliveServerInterval: 10s
      serviceType: ClusterIP
      ports:
        grpc:
          clusterIpPort: 7050
        metrics: 
          enabled: False
          clusterIpPort: 9443
      resources:
        limits:
          memory: 512M
          cpu: 1
        requests:
          memory: 512M
          cpu: 0.25


    healthCheck: 
      retries: 10
      sleepTimeAfterError: 15

      labels:
        service:
          - example1: example2
        pvc:
        deployment:
