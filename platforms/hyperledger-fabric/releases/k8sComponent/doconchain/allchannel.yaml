global:
  version: 2.5.4
  serviceAccountName: vault-auth
  cluster:
    provider: aws
    cloudNativeServices: false
  vault:
    type: hashicorp
    network: fabric
    address: http://vault.vault.svc:8200
    authPath: proddoconchain
    secretEngine: secretsv2
    secretPrefix: "data/proddoconchain"
    role: vault-role
    tls: false
  proxy:
    provider: haproxy
    externalUrlSuffix: org1proxy.hlf.doconchain.com

image:
  alpineUtils: ghcr.io/hyperledger/bevel-alpine:latest
  fabricTools: ghcr.io/hyperledger/bevel-fabric-tools
  pullSecret: ""

orderers:
  - name: orderer1
    adminAddress: orderer1.doconchain-net:7055
  - name: orderer2
    adminAddress: orderer2.doconchain-net:7055
  - name: orderer3
    adminAddress: orderer3.doconchain-net:7055

addOrderer: false

