global:
  version: 2.5.4
  serviceAccountName: vault-auth
  cluster:
    provider: aws
    cloudNativeServices: false
  vault:
    type: hashicorp
    network: fabric
    address: http://vault.vault.svc:8200
    authPath: proddoconchain
    secretEngine: secretsv2
    secretPrefix: "data/proddoconchain"
    role: vault-role
    tls: false
  proxy:
    provider: haproxy
    externalUrlSuffix: org1proxy.hlf.doconchain.com

image:
  alpineUtils: ghcr.io/hyperledger/bevel-alpine:latest
  fabricTools: ghcr.io/hyperledger/bevel-fabric-tools
  pullSecret: ""

organizations:
  - name: doconchain
    orderers:
    - name: orderer1
      ordererAddress: orderer1.doconchain-net.org1proxy.hlf.doconchain.com:443
    - name: orderer2
      ordererAddress: orderer2.doconchain-net.org1proxy.hlf.doconchain.com:443
    - name: orderer3
      ordererAddress: orderer3.doconchain-net.org1proxy.hlf.doconchain.com:443
    peers:
    - name: peer0
      peerAddress: peer0.doconchain-net.org1proxy.hlf.doconchain.com:443
  - name: gov
    peers:
    - name: peer0
      peerAddress: peer0.gov-net.org2proxy.hlf.doconchain.com:443

consensus: raft


channels:
 
 
  - name: allchannel
    consortium: DoconchainConsortium
    orderers: 
      - doconchain
    participants:
      - doconchain
      - gov

settings:
  generateGenesis: True 
  removeConfigMapOnDelete: false

add_new_org: false
newOrgs:
  - name: doconchain
  - name: gov
